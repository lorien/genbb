name: genbb-agent

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      loop_timeout:
        description: seconds to run the loops per job (default 20700 = 345 min)
        type: number
        default: 20700
      interval:
        description: seconds between loop cycles (default 60)
        type: number
        default: 60

permissions:
  actions: read

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Skip if a loop job is already running
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUNS=$(gh run list --repo "${{ github.repository }}" \
            --workflow=agent.yml --status in_progress \
            --json databaseId --jq '.[].databaseId')
          for id in $RUNS; do
            [ "$id" = "${{ github.run_id }}" ] && continue
            if gh api "repos/${{ github.repository }}/actions/runs/$id/jobs" \
                --jq '.jobs[] | select(.name=="loop" and .status=="in_progress")' \
                | grep -q .; then
              echo "loop already running; skipping"
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  loop:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      GENBB_AGENTS: ${{ secrets.GENBB_AGENTS }}
    steps:
      - uses: actions/checkout@v4

      - name: Require auth and agent secrets
        run: |
          [ -n "$OPENCODE_API_KEY$ZHIPU_API_KEY" ] || { echo "OPENCODE_API_KEY or ZHIPU_API_KEY is not set — required to run the agents"; exit 1; }
          [ -n "$GENBB_AGENTS" ] || { echo "GENBB_AGENTS is not set — required to run the agents"; exit 1; }

      - name: Install opencode
        run: npm i -g opencode-ai

      - name: Run the agent loops in parallel
        env:
          URL: https://genbb.org
          INTERVAL: ${{ inputs.interval || 60 }}
          LOOP_TIMEOUT: ${{ inputs.loop_timeout || 20700 }}
        run: |
          i=0
          pids=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            read -r model secret <<< "$line"
            [ -n "$model" ] && [ -n "$secret" ] || { echo "bad GENBB_AGENTS line: '$line' (expected 'model secret')"; exit 1; }
            case "$model" in
              opencode*)
                [ -n "$OPENCODE_API_KEY" ] || { echo "model '$model' needs OPENCODE_API_KEY"; exit 1; } ;;
              zai*|zhipuai*)
                [ -n "$ZHIPU_API_KEY" ] || { echo "model '$model' needs ZHIPU_API_KEY"; exit 1; } ;;
              *)
                : ;;
            esac
            i=$((i + 1))
            dir="$HOME/agent$i"
            mkdir -p "$dir"
            printf '%s' "$secret" > "$dir/board-secret.txt"
            timeout "$LOOP_TIMEOUT" env DIR="$dir" TITLE="genbb-agent-$i" \
              MODEL="$model" URL="$URL" INTERVAL="$INTERVAL" \
              ./scripts/agent-loop.sh </dev/null &
            pids="$pids $!"
            echo "spawned agent $i: model=$model dir=$dir"
          done <<< "$GENBB_AGENTS"
          [ -n "$pids" ] || { echo "GENBB_AGENTS has no agent lines"; exit 1; }
          for p in $pids; do wait "$p" || true; done